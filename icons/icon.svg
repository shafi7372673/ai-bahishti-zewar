<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس منظر کا زمردی رنگ -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062219"/>
      <stop offset="40%" stop-color="#0c382b"/>
      <stop offset="100%" stop-color="#145944"/>
    </linearGradient>

    <!-- سنہری چمکدار گریڈینٹ -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8010"/>
      <stop offset="100%" stop-color="#fdf0a6"/>
    </linearGradient>

    <!-- ورق کا ہلکا سنہری شیڈ -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#faf5e6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5ecd0"/>
    </linearGradient>

    <!-- ریڈیل شائن -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fced95" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c382b" stop-opacity="0"/>
    </radialGradient>

    <!-- ڈراپ شیڈو -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- مین اسکوائرکل بیک گراؤنڈ -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- بیک گراؤنڈ گلو -->
  <circle cx="256" cy="220" r="190" fill="url(#glow)"/>

  <!-- بیرونی سنہری جیومیٹرک بارڈر -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.85"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6"/>

  <!-- چاروں کونوں پر روایتی اسلامی محرابیں / زیور -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <circle cx="56" cy="56" r="6"/>
    <circle cx="456" cy="56" r="6"/>
    <circle cx="56" cy="456" r="6"/>
    <circle cx="456" cy="456" r="6"/>
  </g>

  <!-- مرکزی کتاب کا خاکہ (بہشتی زیور) -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    
    <!-- کتاب کی جلد (Book Cover) -->
    <path d="M 256 160 C 220 145, 140 145, 90 160 C 82 163, 76 170, 76 180 L 76 345 C 130 330, 210 330, 256 348 C 302 330, 382 330, 436 345 C 436 345, 436 180, 436 180 C 436 170, 430 163, 422 160 C 372 145, 292 145, 256 160 Z" 
          fill="#062219" stroke="url(#goldGrad)" stroke-width="7"/>

    <!-- کتاب کے صفحات (Open Book Pages) -->
    <!-- بایاں صفحہ -->
    <path d="M 254 165 C 215 150, 145 150, 96 165 L 96 330 C 145 316, 215 316, 254 335 Z" 
          fill="url(#pageGrad)"/>
    <!-- دایاں صفحہ -->
    <path d="M 258 165 C 297 150, 367 150, 416 165 L 416 330 C 367 316, 297 316, 258 335 Z" 
          fill="url(#pageGrad)"/>

    <!-- صفحے کی لکیریں (تحریر کی علامت) -->
    <g stroke="#aa8010" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
      <!-- دائیں صفحے پر لکیریں -->
      <line x1="280" y1="190" x2="395" y2="195"/>
      <line x1="280" y1="215" x2="390" y2="220"/>
      <line x1="280" y1="240" x2="395" y2="245"/>
      <line x1="280" y1="265" x2="370" y2="270"/>
      <line x1="280" y1="290" x2="385" y2="295"/>

      <!-- بائیں صفحے پر لکیریں -->
      <line x1="117" y1="195" x2="232" y2="190"/>
      <line x1="122" y1="220" x2="232" y2="215"/>
      <line x1="117" y1="245" x2="232" y2="240"/>
      <line x1="142" y1="270" x2="232" y2="265"/>
      <line x1="127" y1="295" x2="232" y2="290"/>
    </g>

    <!-- کتاب کا درمیانی حصہ اور رِبن -->
    <line x1="256" y1="162" x2="256" y2="340" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M 253 340 L 256 385 L 259 340 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- کتاب کے اوپر طلوع ہوتا ہوا نور / چاند اور تارا -->
  <g transform="translate(256, 110)" filter="url(#shadow)">
    <!-- ہلال / چاند -->
    <path d="M 0 -38 A 28 28 0 0 0 -18 16 A 24 24 0 1 1 0 -38 Z" fill="url(#goldGrad)"/>
    <!-- ستارہ -->
    <path d="M 6 -12 L 8 -5 L 15 -5 L 9 -1 L 11 6 L 6 1 L 1 6 L 3 -1 L -3 -5 L 4 -5 Z" fill="#ffffff"/>
  </g>

  <!-- سنہری ربن برائے نام "بہشتی زیور AI" -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- ربن پس منظر -->
    <rect x="56" y="375" width="400" height="74" rx="22" fill="#062219" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- کتاب کا نام: بہشتی زیور (Urdu Text) -->
    <text x="220" y="424" 
          font-family="'Noto Nastaliq Urdu', 'Urdu Typesetting', serif" 
          font-size="34" 
          font-weight="700"
          fill="url(#goldGrad)" 
          text-anchor="middle"
          letter-spacing="1">بہشتی زیور</text>

    <!-- AI کا ماڈرن بیج -->
    <rect x="345" y="388" width="80" height="46" rx="14" fill="url(#goldGrad)"/>
    <text x="385" y="421" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="24" 
          font-weight="900" 
          fill="#062219" 
          text-anchor="middle"
          letter-spacing="1">AI</text>
  </g>
</svg>
